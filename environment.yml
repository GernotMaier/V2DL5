---
# installation:
# create: conda env create -f environment.yml
# activate: conda activate v2dl5
# update: conda env update -f environment.yml --prune
#
name: v2dl5
channels:
  - conda-forge
dependencies:
  - astropy-base
  - astroquery
  - awkward
  - matplotlib
  - pip
  - pre-commit
  - pydantic
  - pyyaml
  - pyflakes
  - pylint
  - pytest
  - pytest-cov
  - pytest-xdist
  - python=3.14
  - scipy
  - uproot
  # These releases provide the Python 3.14 wheels used by this project.
  - pip:
      - "gammapy>=2.1,<2.2"
      - "regions<0.12"
